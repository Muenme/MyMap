name: api-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test server/test

newman:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g newman
      - name: Run Postman collection
        run: >
          newman run server/postman/collection.json
          -e server/postman/ci.postman_environment.json
          --env-var "base=${{ secrets.SUPABASE_HOST }}"
          --env-var "anon=${{ secrets.ANON_KEY }}"
          --reporters cli,junit
          --reporter-junit-export newman-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results
          path: newman-results.xml